<script>
// ===================== CONFIG =====================
const FB_CONFIG = {
  apiKey: "AIzaSyBQ7_k7huhS8oAyKp0OsbEajXFmrNxcrlo",
  authDomain: "kyro-7cb7a.firebaseapp.com",

};

const REF_PRODUTOS = "cadastros/produtos_mestre";
const REF_RESPONS = "hl_inspecao/responsaveis";
const REF_LEITURAS = "hl_inspecao/leituras";

const NA = "N/A";
const ORIGEM = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)
               ? "MOBILE" : "PC";

let db = null, fbOk = false;
let produtos = [], responsaveis = [], leituras = [];

// ===================== FIREBASE =====================
function conectar() {
  try {
    firebase.initializeApp(FB_CONFIG);
    db = firebase.database();
    fbOk = true;
    escutar();
  } catch (e) {
    console.warn("Firebase indisponível:", e);
    setSync(false);
  }
}

function setSync(on) {
  const el = document.getElementById('sync');
  el.textContent = on ? '● Sincronizado' : '○ Offline';
  el.className = 'sync ' + (on ? 'on' : '');
}

function escutar() {
  db.ref(REF_PRODUTOS).on('value', snap => {
    const cru = snap.val() || {};
    const arr = Array.isArray(cru) ? cru : Object.values(cru);

    produtos = arr
      .filter(p => p && typeof p === 'object')
      .map(p => ({
        pn: String(p.partNumber || p.pn || '').trim().toUpperCase(),
        descricao: String(p.descricao || '').trim().toUpperCase(),
        fornecedor: String(p.fornecedor || '').trim().toUpperCase(),
        codigoFornecedor:
          String(p.codigoFornecedor || '').trim().toUpperCase(),
        multiploCaixa: Number(p.multiploCaixa) || 0,
        multiploPallet: Number(p.multiploPallet) || 0
      }))
      .filter(p => p.pn)
      .sort((a, b) => a.pn.localeCompare(b.pn));

    renderCatalogo();
  }, err => console.warn("catalogo:", err));

  db.ref(REF_RESPONS).on('value', snap => {
    const v = snap.val() || {};
    responsaveis = Object.values(v).map(r => r.nome).filter(Boolean);
    renderResponsaveis();
  }, err => console.warn(err));

  db.ref(REF_LEITURAS).on('value', snap => {
    const v = snap.val() || {};
    leituras = Object.entries(v)
      .map(([id, obj]) => Object.assign({ _id: id }, obj))
      .sort((a, b) => (a.criado || 0) - (b.criado || 0));
    renderTabela();
    setSync(true);
  }, err => { console.warn(err); setSync(false); });
}

// ===================== RESPONSÁVEIS =====================
function renderResponsaveis() {
  const sel = document.getElementById('resp');
  const atual = sel.value;
  sel.innerHTML = '<option value="">— selecione —</option>' +
    responsaveis.map(n => `<option>${esc(n)}</option>`).join('');
  if (atual) sel.value = atual;
}

async function novoResponsavel() {
  const nome = prompt("Nome do responsável:");
  if (!nome) return;
  const chave = nome.trim().toUpperCase().replace(/\s+/g, '_');
  try {
    await db.ref(`${REF_RESPONS}/${chave}`).set({ nome: nome.trim() });
    document.getElementById('resp').value = nome.trim();
  } catch (e) {
    alert("Erro ao salvar: " + e.message);
  }
}

// ===================== LEITURA DE ETIQUETAS =====================
function soAlnum(txt) {
  return String(txt == null ? '' : txt)
    .toUpperCase().replace(/[^A-Z0-9]/g, '');
}

function detectarTipo(bruto) {
  const t = soAlnum(bruto);
  if (!t) return 'desconhecido';
  if (t.startsWith('PRID')) return 'fornecedor';
  if (/^P0{6,}/.test(t) && t.length >= 20) return 'mando';
  if (t.length >= 24 && /\d{6}$/.test(t)) return 'mando';
  if (/^\d{4,12}$/.test(t)) return 'fornecedor';
  return 'desconhecido';
}

// MANDO: P + zeros + PN + zeros + LOTE + zeros + QTD
// P00000000000000BH9003Z10000000000VKRA000600
function parseMando(bruto) {
  const t = soAlnum(bruto);
  if (!t) return null;

  const corpo = t.startsWith('P') ? t.slice(1) : t;

  let m = corpo.match(/([A-Z]{2,10})0*(\d{1,6})$/);
  if (!m) m = corpo.match(/([A-Z][A-Z0-9]{1,9})0*(\d{1,6})$/);
  if (!m) return null;

  const lote = m[1];
  const quantidade = String(parseInt(m[2], 10) || 0);

  const resto = corpo.slice(0, m.index).replace(/^0+/, '');
  if (!resto) return null;

  return { pn: resto, lote, quantidade, bruto: t };
}

// FORNECEDOR: prid889595 · 889595 · "DASOL 889595 2026-11-12"
function parseFornecedor(bruto) {
  const t = String(bruto == null ? '' : bruto).toUpperCase();
  if (!t.trim()) return null;

  let m = t.match(/PRID[^A-Z0-9]*([A-Z0-9]{3,20})/);
  if (m) return { lote: m[1], fornecedor: 'DASOL', bruto: t };

  m = t.match(/LOTE[^A-Z0-9]*([A-Z0-9]{3,20})/);
  if (m) return { lote: m[1], fornecedor: '?', bruto: t };

  let limpo = t.replace(/\d{4}[-/.]\d{1,2}[-/.]\d{1,2}/g, ' ');
  limpo = limpo.replace(/\d{1,2}[-/.]\d{1,2}[-/.]\d{2,4}/g, ' ');

  const achados = limpo.match(/(?<!\d)\d{4,12}(?!\d)/g);
  if (achados && achados.length) {
    achados.sort((a, b) => b.length - a.length);
    return { lote: achados[0], fornecedor: '?', bruto: t };
  }
  return null;
}

// Resolve o PN da etiqueta contra o catálogo do Cadastro.
// A etiqueta traz BH9003Z100 + zeros de preenchimento; o cadastro tem
// BH9003Z100.D. A comparação descarta os zeros à direita da etiqueta.
function resolverPn(pnBruto) {
  const alvo = soAlnum(pnBruto);
  if (!alvo) return { produto: null, motivo: 'vazio', candidatos: [] };

  const base = alvo.replace(/0+$/, '');
  const chave = base.length >= 5 ? base : alvo;

  const exatos = [], prefixos = [], parciais = [];

  produtos.forEach(p => {
    const n = soAlnum(p.pn);
    if (!n) return;

    if (n === alvo || n === chave) { exatos.push(p); return; }
    if (n.startsWith(alvo)) { prefixos.push(p); return; }
    if (chave.length >= 6 && n.startsWith(chave)) { prefixos.push(p); return; }
    if (chave.length >= 4 && (n.includes(chave) || chave.includes(n))) {
      parciais.push(p);
    }
  });

  const escolher = lista => {
    const ord = lista.slice().sort((a, b) => a.pn.length - b.pn.length);
    return {
      produto: ord[0],
      motivo: lista.length === 1 ? 'prefixo' : 'multiplo',
      candidatos: lista.length === 1 ? [] : ord.slice(0, 6)
    };
  };

  if (exatos.length) return escolher(exatos);
  if (prefixos.length) return escolher(prefixos);
  if (parciais.length) return escolher(parciais);

  return { produto: null, motivo: 'nenhum', candidatos: [] };
}

function setBipMsg(html, kind) {
  const el = document.getElementById('bip-msg');
  el.className = kind || '';
  el.innerHTML = html || '';
}

// ===================== SCANNER (html5-qrcode) =====================
let html5Qr = null;
let scanRodando = false;
let scanCb = null;

function setScanMsg(txt) {
  const el = document.getElementById('scan-msg');
  if (el) el.textContent = txt || '';
}

const FORMATOS_QR = [
  'QR_CODE', 'DATA_MATRIX', 'CODE_128', 'CODE_39', 'CODE_93',
  'EAN_13', 'EAN_8', 'UPC_A', 'UPC_E', 'ITF', 'CODABAR'
];

function formatosSuportados() {
  const F = window.Html5QrcodeSupportedFormats || {};
  const out = [];
  FORMATOS_QR.forEach(k => {
    if (F[k] !== undefined && F[k] !== null) out.push(F[k]);
  });
  return out.length ? out : undefined;
}

// Garante a lib carregada (CDN principal no <head>, reserva aqui).
function carregarHtml5Qrcode() {
  if (window.Html5Qrcode) return Promise.resolve(true);

  const urls = [
    'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js',
    'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js'
  ];

  return urls.reduce((p, url) => p.then(ok => ok ? true : new Promise(res => {
    const s = document.createElement('script');
    s.src = url;
    s.async = true;
    s.onload = () => res(!!window.Html5Qrcode);
    s.onerror = () => res(false);
    document.head.appendChild(s);
  })), Promise.resolve(false));
}

async function abrirCamera(cb) {
  const box = document.getElementById('scan-box');

  if (box.style.display === 'flex' && scanRodando) {
    await fecharScan();
    return;
  }

  scanCb = cb || null;
  box.style.display = 'flex';
  setScanMsg('Abrindo a câmera…');

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setScanMsg('Este navegador não libera a câmera. Use "Digitar".');
    return;
  }

  const okLib = await carregarHtml5Qrcode();
  if (!okLib || typeof Html5Qrcode === 'undefined') {
    setScanMsg('Leitor não carregou. Toque em "Digitar" para inserir o código.');
    return;
  }

  try {
    if (!html5Qr) {
      html5Qr = new Html5Qrcode('qr-reader', { verbose: false });
    }

    await html5Qr.start(
      { facingMode: 'environment' },
      {
        fps: 10,
        qrbox: (w, h) => {
          const m = Math.floor(Math.min(w, h) * 0.75);
          return { width: m, height: m };
        },
        formatsToSupport: formatosSuportados(),
        experimentalFeatures: { useBarCodeDetectorIfSupported: true }
      },
      texto => entregarScan(texto),
      () => {}   // "não encontrado" é normal entre frames
    );

    scanRodando = true;
    setScanMsg('Aponte para a etiqueta');
  } catch (e) {
    scanRodando = false;
    const msg = (e && e.message) ? e.message : String(e);
    setScanMsg('Não foi possível abrir a câmera: ' + msg +
               ' — toque em "Digitar".');
  }
}

function entregarScan(raw) {
  if (!raw) return;
  const cb = scanCb;
  scanCb = null;
  fecharScan().then(() => {
    if (cb) cb(String(raw).trim());
  });
}

async function fecharScan() {
  const box = document.getElementById('scan-box');
  box.style.display = 'none';
  setScanMsg('');

  const rodando = scanRodando;
  scanRodando = false;

  if (html5Qr) {
    try { if (rodando) await html5Qr.stop(); } catch (e) {}
    try { html5Qr.clear(); } catch (e) {}
    html5Qr = null;
  }

  const alvo = document.getElementById('qr-reader');
  if (alvo) alvo.innerHTML = '';
}

function entradaManual() {
  const cb = scanCb;
  const v = prompt('Digite ou cole o código da etiqueta:');
  if (v === null) return;

  const texto = v.trim();
  if (!texto) return;

  scanCb = null;
  fecharScan();

  if (cb) cb(texto);
  else processarEtiqueta(texto, 'auto');
}

// ===================== BIPE =====================
function bipar(modo) {
  const titulo = document.getElementById('scan-titulo');
  if (modo === 'mando') titulo.textContent = 'Bipe a etiqueta da MANDO';
  else if (modo === 'fornecedor') titulo.textContent = 'Etiqueta do FORNECEDOR';
  else if (modo === 'pn') titulo.textContent = 'Bipe o código do produto';
  else titulo.textContent = 'Aponte para a etiqueta';

  abrirCamera(raw => {
    if (modo === 'pn') {
      document.getElementById('busca').value = raw;
      buscar();
      return;
    }
    processarEtiqueta(raw, modo);
  });
}

function processarEtiqueta(raw, modo) {
  const tipo = (modo === 'auto' || !modo) ? detectarTipo(raw) : modo;

  if (tipo === 'mando') {
    const d = parseMando(raw);
    if (!d) {
      setBipMsg(`<div class="err">Etiqueta Mando fora do padrão.<br>
        <span class="tag">${esc(raw)}</span></div>`);
      return;
    }

    const r = resolverPn(d.pn);
    let pn = d.pn, descricao = '';
    if (r.produto) { pn = r.produto.pn; descricao = r.produto.descricao; }

    document.getElementById('f_part_number').value = pn;
    document.getElementById('f_descricao').value = descricao;
    document.getElementById('f_quantidade').value = d.quantidade;
    document.getElementById('f_lote_mando').value = d.lote;
    if (!document.getElementById('f_data_entrada').value) marcarHoje();

    let msg = `<div class="ok"><b>MANDO lido</b><br>
      PN etiqueta: ${esc(d.pn)} · Lote: ${esc(d.lote)} · Qtd: ${esc(d.quantidade)}`;

    if (r.produto) {
      msg += `<br>Catálogo: ${esc(r.produto.pn)} — ${esc(r.produto.descricao)}`;
      if (r.motivo === 'multiplo') {
        msg += `<br><span style="color:#b45309">${r.candidatos.length} PNs parecidos — confirme abaixo.</span>`;
      }
    } else {
      msg += `<br><span style="color:#b45309">PN não encontrado no Cadastro.</span>`;
    }
    msg += `</div>`;
    setBipMsg(msg);

    if (r.motivo === 'multiplo') mostrarCandidatosBip(r.candidatos);
    else limparCandidatos();

    document.getElementById('f_lote_fornecedor').focus();
    return;
  }

  if (tipo === 'fornecedor') {
    const d = parseFornecedor(raw);
    if (!d) {
      setBipMsg(`<div class="err">Etiqueta de fornecedor fora do padrão.<br>
        <span class="tag">${esc(raw)}</span></div>`);
      return;
    }
    document.getElementById('f_lote_fornecedor').value = d.lote;
    if (!document.getElementById('f_data_entrada').value) marcarHoje();

    setBipMsg(`<div class="ok"><b>FORNECEDOR lido</b><br>
      Lote: ${esc(d.lote)} · Fornecedor: ${esc(d.fornecedor)}</div>`);
    return;
  }

  setBipMsg(`<div class="err">Código não reconhecido.<br>
    <span class="tag">${esc(raw)}</span><br>
    Use os botões Mando / Forn. para forçar o tipo.</div>`);
}

function mostrarCandidatosBip(lista) {
  const box = document.getElementById('cands');
  box.innerHTML = `<div class="hint" style="margin-bottom:6px">
    PNs parecidos com a etiqueta — toque para confirmar:</div>` +
    lista.map(p =>
      `<div class="cand" onclick="escolherPorPn('${esc(p.pn)}')">
        <b>${esc(p.pn)}</b><br>
        <span style="color:#5a6b7a">${esc(p.descricao)}</span>
        ${detalheExtra(p)}
      </div>`).join('');
}

function limparCandidatos() {
  document.getElementById('cands').innerHTML = '';
  document.getElementById('busca-msg').textContent = '';
}

// ===================== BUSCA NO CATÁLOGO =====================
function acharCandidatos(termo) {
  const t = String(termo || '').trim().toUpperCase();
  if (!t) return { exato: null, cands: [], total: 0 };

  const exato = produtos.find(p => p.pn === t);
  if (exato) return { exato, cands: [], total: 1 };

  const tl = t.toLowerCase();
  const achados = [];

  produtos.forEach(p => {
    const pnl = p.pn.toLowerCase();
    const dcl = (p.descricao || '').toLowerCase();
    if (pnl.includes(tl)) {
      achados.push({ pri: pnl.startsWith(tl) ? 0 : 1, p });
    } else if (dcl.includes(tl)) {
      achados.push({ pri: 2, p });
    }
  });

  achados.sort((a, b) =>
    a.pri !== b.pri ? a.pri - b.pri : a.p.pn.localeCompare(b.p.pn));

  return {
    exato: null,
    cands: achados.slice(0, 12).map(x => x.p),
    total: achados.length
  };
}

function detalheExtra(p) {
  const partes = [];
  if (p.multiploCaixa) partes.push('cx: ' + p.multiploCaixa);
  if (p.multiploPallet) partes.push('plt: ' + p.multiploPallet);
  if (p.codigoFornecedor) partes.push('cod: ' + p.codigoFornecedor);
  return partes.length
    ? `<span class="tag">${esc(partes.join(' · '))}</span>`
    : '';
}

function buscarPreview() {
  const termo = document.getElementById('busca').value.trim();
  const msg = document.getElementById('busca-msg');
  const box = document.getElementById('cands');
  msg.textContent = '';
  box.innerHTML = '';

  if (termo.length < 2) return;

  const { exato, cands } = acharCandidatos(termo);

  if (exato) {
    box.innerHTML = `<div class="cand" onclick="escolherPorPn('${esc(exato.pn)}')">
      <b>${esc(exato.pn)}</b><br>
      <span style="color:#5a6b7a">${esc(exato.descricao)}</span>
      ${detalheExtra(exato)}</div>`;
    return;
  }

  if (!cands.length) {
    msg.textContent = `Nenhum PN no Cadastro com "${termo}".`;
    return;
  }

  box.innerHTML = cands.map(p =>
    `<div class="cand" onclick="escolherPorPn('${esc(p.pn)}')">
      <b>${esc(p.pn)}</b><br>
      <span style="color:#5a6b7a">${esc(p.descricao)}</span>
      ${detalheExtra(p)}
    </div>`).join('');
}

function buscar() {
  const termo = document.getElementById('busca').value.trim();
  const msg = document.getElementById('busca-msg');
  const box = document.getElementById('cands');
  msg.textContent = '';
  box.innerHTML = '';

  if (!termo) return;

  const { exato, cands, total } = acharCandidatos(termo);

  if (exato) {
    preencher(exato);
    document.getElementById('busca').value = '';
    document.getElementById('f_quantidade').focus();
    return;
  }

  if (cands.length === 1) {
    preencher(cands[0]);
    document.getElementById('busca').value = '';
    document.getElementById('f_quantidade').focus();
    return;
  }

  if (!cands.length) {
    msg.textContent = `Nenhum PN no Cadastro com "${termo}". ` +
                      `Cadastre no módulo Cadastros.`;
    return;
  }

  let extra = '';
  if (total > cands.length) {
    extra = ` — mostrando ${cands.length} de ${total}`;
  }

  box.innerHTML = `<div class="hint" style="margin-bottom:6px">
    ${cands.length} PN(s) no Cadastro${extra}. Toque para usar:</div>` +
    cands.map(p =>
      `<div class="cand" onclick="escolherPorPn('${esc(p.pn)}')">
        <b>${esc(p.pn)}</b><br>
        <span style="color:#5a6b7a">${esc(p.descricao)}</span>
        ${detalheExtra(p)}
      </div>`).join('');
}

function escolherPorPn(pn) {
  const p = produtos.find(x => x.pn === pn);
  if (!p) return;
  preencher(p);
  document.getElementById('busca').value = '';
  limparCandidatos();
  document.getElementById('f_quantidade').focus();
}

function preencher(p) {
  document.getElementById('f_part_number').value = p.pn || '';
  document.getElementById('f_descricao').value = p.descricao || '';
}

// ===================== CATÁLOGO =====================
function renderCatalogo() {
  const box = document.getElementById('cat_lista');
  const cnt = document.getElementById('cat_count');
  const termo = (document.getElementById('cat_busca').value || '')
                  .trim().toUpperCase();

  const lista = termo
    ? produtos.filter(p =>
        p.pn.includes(termo) || (p.descricao || '').includes(termo))
    : produtos;

  cnt.textContent = lista.length +
    (lista.length === 1 ? ' PN' : ' PNs') +
    (termo ? ' de ' + produtos.length : '');

  if (!lista.length) {
    box.innerHTML = '<div class="empty">' +
      (produtos.length ? 'Nenhum PN com esse filtro.'
                       : 'Catálogo vazio. Cadastre produtos no módulo Cadastros.') +
      '</div>';
    return;
  }

  box.innerHTML = lista.slice(0, 200).map(p => `
    <div style="border-bottom:1px solid #e5e7eb;padding:10px 0">
      <b style="color:#002c5f">${esc(p.pn)}</b><br>
      <span style="font-size:13px;color:#5a6b7a">${esc(p.descricao)}</span>
      ${p.fornecedor ? `<br><span style="font-size:11px;color:#8a97a5">forn: ${esc(p.fornecedor)}</span>` : ''}
      ${detalheExtra(p)}
    </div>`).join('') +
    (lista.length > 200
      ? `<div class="hint" style="padding:10px 0">Mostrando 200 de ${lista.length}. Refine a busca.</div>`
      : '');
}

// ===================== FORM =====================
function marcarNA(id) {
  document.getElementById(id).value = NA;
}

function marcarHoje() {
  document.getElementById('f_data_entrada').value = hoje();
}

function hoje() {
  const d = new Date();
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

function dadosForm() {
  return {
    part_number: document.getElementById('f_part_number').value.trim(),
    descricao: document.getElementById('f_descricao').value.trim(),
    quantidade: document.getElementById('f_quantidade').value.trim() || NA,
    lote_mando: document.getElementById('f_lote_mando').value.trim() || NA,
    lote_fornecedor: document.getElementById('f_lote_fornecedor').value.trim() || NA,
    data_entrada: document.getElementById('f_data_entrada').value || hoje(),
  };
}

async function adicionar(limparDepois) {
  const msg = document.getElementById('form-msg');
  msg.textContent = '';

  const d = dadosForm();
  const resp = document.getElementById('resp').value.trim();

  if (!d.part_number && !d.descricao) {
    msg.textContent = 'Informe o PART NUMBER ou a DESCRIÇÃO.';
    return;
  }
  if (!resp) {
    msg.textContent = 'Selecione o responsável.';
    return;
  }

  const reg = Object.assign({}, d, {
    responsavel: resp,
    criado: Date.now(),
    origem: ORIGEM
  });

  try {
    await db.ref(REF_LEITURAS).push(reg);
    msg.className = 'ok';
    msg.textContent = 'Linha adicionada.';
    setTimeout(() => msg.textContent = '', 1800);
    if (limparDepois) limparForm();
  } catch (e) {
    msg.className = 'err';
    msg.textContent = 'Falha ao salvar: ' + e.message;
  }
}

function adicionarLimpar() {
  adicionar(true);
}

function limparForm() {
  ['f_part_number', 'f_descricao', 'f_quantidade',
   'f_lote_mando', 'f_lote_fornecedor'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('f_data_entrada').value = hoje();
  setBipMsg('');
  limparCandidatos();
  document.getElementById('busca').focus();
}

// ===================== TABELA =====================
function renderTabela() {
  const tb = document.querySelector('#tabela tbody');
  const vazio = document.getElementById('vazio');

  tb.innerHTML = leituras.map(l => {
    const cls = [l.quantidade, l.lote_mando, l.lote_fornecedor]
      .some(v => String(v).toUpperCase() === NA) ? ' class="na"' : '';
    return `<tr${cls}>
      <td>${esc(l.part_number || '')}</td>
      <td>${esc((l.descricao || '').substring(0, 30))}</td>
      <td>${esc(l.quantidade || '')}</td>
      <td>${esc(l.lote_mando || '')}</td>
      <td>${esc(l.lote_fornecedor || '')}</td>
      <td>${esc(l.data_entrada || '')}</td>
      <td>${esc((l.responsavel || '').substring(0, 14))}</td>
      <td style="color:#b91c1c;cursor:pointer"
          onclick="excluirLinha('${l._id}')">✕</td>
    </tr>`;
  }).join('');

  vazio.style.display = leituras.length ? 'none' : 'block';

  document.getElementById('cnt').textContent =
    leituras.length + ' linha' + (leituras.length === 1 ? '' : 's');
  document.getElementById('badge').textContent = leituras.length;

  const pns = new Set(leituras.map(l => l.part_number).filter(Boolean));
  document.getElementById('cnt-pn').textContent =
    pns.size ? pns.size + ' PNs' : '';
}

async function excluirLinha(id) {
  if (!confirm('Remover esta linha?')) return;
  try {
    await db.ref(`${REF_LEITURAS}/${id}`).remove();
  } catch (e) {
    alert('Erro: ' + e.message);
  }
}

async function limparTudo() {
  if (!leituras.length) return;
  if (!confirm(`Remover todas as ${leituras.length} linhas?\n` +
               'Gere o Excel antes, se precisar guardar.')) return;
  try {
    await db.ref(REF_LEITURAS).remove();
  } catch (e) {
    alert('Erro: ' + e.message);
  }
}

// ===================== EXCEL =====================
function exportar() {
  if (!leituras.length) {
    alert('Nenhuma linha para exportar.');
    return;
  }

  const dados = leituras.map(l => ([
    l.part_number || '',
    l.descricao || '',
    l.quantidade || '',
    l.lote_mando || '',
    l.lote_fornecedor || '',
    l.data_entrada || '',
    l.responsavel || ''
  ]));

  const cab = [[
    'PART NUMBER', 'DESCRIÇÃO', 'QUANTIDADE', 'LOTE MANDO',
    'LOTE FORNECEDOR', 'DATA DE ENTRADA', 'RESPONSÁVEL'
  ]];

  const ws = XLSX.utils.aoa_to_sheet(cab.concat(dados));
  ws['!cols'] = [
    { wch: 24 }, { wch: 40 }, { wch: 12 }, { wch: 20 },
    { wch: 22 }, { wch: 16 }, { wch: 22 }
  ];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Inspecao');

  const nome = 'Inspecao_' + hoje() + '.xlsx';
  XLSX.writeFile(wb, nome);
}

// ===================== ABAS =====================
function mudarAba(nome) {
  ['leitura', 'linhas', 'catalogo'].forEach(n => {
    document.getElementById('tab-' + n).classList.toggle(
      'active', n === nome);
    const b = document.getElementById('tabbtn-' + n);
    b.classList.toggle('btn-ghost', n !== nome);
    b.classList.toggle('btn-teal', n === nome);
  });
  if (nome === 'catalogo') renderCatalogo();
}

// ===================== UTIL =====================
function esc(t) {
  return String(t == null ? '' : t)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ===================== INIT =====================
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('f_data_entrada').value = hoje();
  conectar();
  mudarAba('leitura');
});
</script>
