<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#002c5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Inspeção de Recebimento</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
:root{
  --azul:#002c5f; --teal:#00b2a9; --bg:#eef2f6; --card:#fff;
  --linha:#d7dee6; --texto:#1e293b; --muted:#64748b;
  --ok:#15803d; --erro:#b91c1c; --aviso:#b45309;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;padding:0 0 96px;
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--texto);font-size:16px;
}
header{
  position:sticky;top:0;z-index:30;background:var(--azul);color:#fff;
  padding:10px 14px;display:flex;align-items:center;gap:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.18);
  padding-top:calc(10px + env(safe-area-inset-top));
}
header .tit{font-size:15px;font-weight:700}
header .sub{font-size:11px;color:#a9c4de}
header .sync{
  margin-left:auto;font-size:11px;font-weight:700;
  padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.12);
  white-space:nowrap;
}
.sync.on{color:#8affab}
.sync.off{color:#ffcf7a}

main{padding:12px;max-width:720px;margin:0 auto}
.card{
  background:var(--card);border:1px solid var(--linha);border-radius:12px;
  padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(15,23,42,.05);
}
.card h2{
  margin:0 0 10px;font-size:11px;font-weight:800;letter-spacing:.8px;
  text-transform:uppercase;color:var(--azul);
  display:flex;align-items:center;gap:6px;
}
.card h2::after{content:"";flex:1;height:2px;background:var(--teal);border-radius:2px}
.dica{font-size:11.5px;color:var(--muted);line-height:1.55;margin:0 0 8px}
.dica b{color:var(--azul)}

label{
  display:block;font-size:10.5px;font-weight:800;letter-spacing:.5px;
  text-transform:uppercase;color:var(--muted);margin:10px 0 4px;
}
label:first-of-type{margin-top:0}
input,select{
  width:100%;font-size:16px;font-family:inherit;color:var(--texto);
  background:#fff;border:1px solid var(--linha);border-radius:9px;
  padding:12px;outline:none;
}
input:focus,select:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,178,169,.15)}
.mono{font-family:Consolas,'SF Mono',Menlo,monospace;font-weight:700;letter-spacing:.4px}

.linha{display:flex;gap:8px;align-items:flex-end}
.linha>.campo{flex:1}
.mini{
  border:0;border-radius:9px;padding:12px 10px;font-size:11px;font-weight:800;
  letter-spacing:.4px;cursor:pointer;white-space:nowrap;font-family:inherit;
}
.mini.na{background:var(--aviso);color:#fff}
.mini.azul{background:var(--azul);color:#fff}

.btn{
  width:100%;border:0;border-radius:10px;padding:15px;font-size:14px;
  font-weight:800;letter-spacing:.4px;cursor:pointer;font-family:inherit;
}
.btn:active{transform:scale(.99)}
.btn-prim{background:var(--ok);color:#fff}
.btn-sec{background:var(--teal);color:#fff}
.btn-ter{background:#fff;color:var(--azul);border:1px solid var(--linha)}
.btn-x{background:#fff;color:var(--erro);border:1px solid #f3c7c7}

/* ===== câmera — mesmo esquema do pesagem.html ===== */
#qr-reader{
  display:none;
  width:100%;
  border-radius:12px;
  overflow:hidden;
  background:#000;
  margin-top:10px;
}
#qr-reader.on{display:block}
#qr-reader video{
  width:100% !important;
  border-radius:12px;
}
#qr-reader img{display:none !important}
#qr-reader__dashboard_section_csr{padding:0 !important;border:0 !important}
#qr-reader__dashboard_section_fsr{display:none !important}
#qr-reader__camera_permission_button,
#qr-reader__file_scan_button{display:none !important}
#qr-reader__header_message,#qr-reader__status_span{display:none !important}

.msg{
  margin-top:10px;font-size:12.5px;line-height:1.55;white-space:pre-wrap;
  word-break:break-word;padding:10px 12px;border-radius:9px;background:#f8fafc;
  border-left:4px solid var(--linha);display:none;
}
.msg.on{display:block}
.msg.ok{border-left-color:var(--ok);background:#f0fdf4;color:#14532d}
.msg.aviso{border-left-color:var(--aviso);background:#fffbeb;color:#78350f}
.msg.erro{border-left-color:var(--erro);background:#fef2f2;color:#7f1d1d}

.cands{margin-top:8px}
.cand{
  background:#f8fafc;border:1px solid var(--linha);border-radius:9px;
  padding:10px;margin-bottom:6px;cursor:pointer;
}
.cand:active{background:#eef6f6;border-color:var(--teal)}
.cand .pn{font-family:Consolas,monospace;font-weight:800;font-size:13px;color:var(--azul)}
.cand .ds{font-size:11.5px;color:var(--muted);margin-top:2px}

.tab-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:680px}
th{
  background:var(--azul);color:#fff;text-align:left;padding:9px 8px;
  font-size:10px;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;
}
td{padding:9px 8px;border-bottom:1px solid var(--linha);vertical-align:top}
tr:nth-child(even) td{background:#f8fafc}
td.mono{font-size:11.5px;font-weight:700}
.vazio{text-align:center;color:var(--muted);font-size:12.5px;padding:22px}

.barra{
  position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;
  border-top:1px solid var(--linha);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  display:flex;gap:8px;box-shadow:0 -2px 10px rgba(15,23,42,.06);
}
.barra .btn{flex:1}

.tag{
  display:inline-block;font-size:10px;font-weight:800;letter-spacing:.4px;
  padding:2px 7px;border-radius:20px;background:#e2e8f0;color:#334155;
  margin-left:6px;vertical-align:middle;
}
</style>
</head>

<body>

<header>
  <div>
    <div class="tit">Inspeção de Recebimento</div>
    <div class="sub">Mando · CATiON · Fornecedor</div>
  </div>
  <div class="sync off" id="sync">•••</div>
</header>

<main>

  <section class="card">
    <h2>Bipe ou escaneie a etiqueta</h2>
    <p class="dica">
      <b>Mando:</b> P000…PN…LOTE…QTD<br>
      <b>CATiON:</b> 0000000280_000000BC410B4200.A2<br>
      <b>Fornecedor:</b> prid889595
    </p>

    <div class="linha">
      <div class="campo">
        <label for="bipe">Código lido</label>
        <input id="bipe" class="mono" placeholder="Aponte o leitor aqui"
               autocomplete="off" autocapitalize="characters" spellcheck="false">
      </div>
      <button class="mini azul" id="btnColar" type="button">Colar</button>
    </div>

    <div class="linha" style="margin-top:10px">
      <div class="campo">
        <label for="modo">Tipo de etiqueta</label>
        <select id="modo">
          <option value="auto">Automático</option>
          <option value="mando">Mando</option>
          <option value="cation">CATiON</option>
          <option value="fornecedor">Fornecedor</option>
        </select>
      </div>
      <button class="btn" id="btnCamera" type="button"
              style="width:auto;padding:13px 18px;font-size:12px;background:var(--azul);color:#fff">
        Câmera
      </button>
    </div>

    <div id="qr-reader"></div>

    <button class="btn btn-ter" id="btnDigitar" type="button"
            style="margin-top:10px;font-size:12px">Digitar código</button>

    <div class="msg" id="msg"></div>
  </section>

  <section class="card">
    <h2>Dados da leitura</h2>

    <label for="fBusca">Buscar no catálogo (PN ou descrição)</label>
    <input id="fBusca" class="mono" placeholder="Ex.: 249 ou SUPORTE"
           autocomplete="off" autocapitalize="characters" spellcheck="false">
    <div class="cands" id="cands"></div>

    <label for="fPn">PART NUMBER</label>
    <input id="fPn" class="mono" autocomplete="off" autocapitalize="characters" spellcheck="false">

    <label for="fDesc">DESCRIÇÃO</label>
    <input id="fDesc" autocomplete="off" autocapitalize="characters">

    <label for="fQtd">QUANTIDADE</label>
    <input id="fQtd" inputmode="numeric" autocomplete="off">

    <div class="linha">
      <div class="campo">
        <label for="fLoteM">LOTE MANDO</label>
        <input id="fLoteM" class="mono" autocomplete="off" autocapitalize="characters">
      </div>
      <button class="mini na" type="button" data-na="fLoteM">N/A</button>
    </div>

    <div class="linha">
      <div class="campo">
        <label for="fLoteF">LOTE FORNECEDOR</label>
        <input id="fLoteF" class="mono" autocomplete="off" autocapitalize="characters">
      </div>
      <button class="mini na" type="button" data-na="fLoteF">N/A</button>
    </div>

    <div class="linha">
      <div class="campo">
        <label for="fData">DATA DE ENTRADA</label>
        <input id="fData" type="date">
      </div>
      <button class="mini azul" type="button" data-hoje="fData">Hoje</button>
    </div>

    <div class="linha">
      <div class="campo">
        <label for="fResp">RESPONSÁVEL</label>
        <input id="fResp" list="listaResp" placeholder="Quem libera" autocomplete="off">
      </div>
      <button class="mini azul" type="button" id="btnResp">+</button>
    </div>
    <datalist id="listaResp"></datalist>
  </section>

  <section class="card">
    <h2>Leituras <span class="tag" id="tagCount">0</span></h2>
    <div class="tab-wrap">
      <table>
        <thead>
          <tr>
            <th>Part Number</th>
            <th>Descrição</th>
            <th>Qtd</th>
            <th>Lote Mando</th>
            <th>Lote Forn.</th>
            <th>Data</th>
            <th>Resp.</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="corpo">
          <tr><td colspan="8" class="vazio">Nenhuma leitura ainda.</td></tr>
        </tbody>
      </table>
    </div>

    <div class="linha" style="margin-top:12px">
      <button class="btn btn-ter" id="btnCsv" type="button" style="font-size:12px">Exportar CSV</button>
      <button class="btn btn-x" id="btnLimpar" type="button" style="font-size:12px">Limpar lista</button>
    </div>
  </section>

</main>

<div class="barra">
  <button class="btn btn-prim" id="btnAdd" type="button">ADICIONAR</button>
  <button class="btn btn-sec" id="btnAddLimpar" type="button">ADICIONAR E LIMPAR</button>
</div>

<script>
/* =======================================================================
   FIREBASE — mesma base do cadastro.py / firebase_sync.py
   ======================================================================= */
const FB_CONFIG = {
  apiKey: "AIzaSyBQ7_k7huhS8oAyKp0OsbEajXFmrNxcrlo",
  authDomain: "kyro-7cb7a.firebaseapp.com",
  databaseURL: "https://kyro-7cb7a-default-rtdb.firebaseio.com",
  projectId: "kyro-7cb7a",
  storageBucket: "kyro-7cb7a.appspot.com"
};

const REF_PRODUTOS = "cadastros/produtos_mestre";
const REF_RESPONS  = "hl_inspecao/responsaveis";
const REF_LEITURAS = "hl_inspecao/leituras";
const NA = "N/A";
const ORIGEM = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) ? "MOBILE" : "PC";

let db = null;
let produtos = [];
let responsaveis = [];
let leituras = [];

/* =======================================================================
   UTIL
   ======================================================================= */
function $(id) { return document.getElementById(id); }
function up(t) { return String(t == null ? "" : t).trim().toUpperCase(); }
function soAlnum(t) { return up(t).replace(/[^A-Z0-9]/g, ""); }

function hoje() {
  const d = new Date();
  return d.getFullYear() + "-" +
         String(d.getMonth() + 1).padStart(2, "0") + "-" +
         String(d.getDate()).padStart(2, "0");
}

function msg(txt, tipo) {
  const el = $("msg");
  el.className = "msg on " + (tipo || "");
  el.textContent = txt;
}
function msgOff() { $("msg").className = "msg"; $("msg").textContent = ""; }

function pintarSync(ok) {
  const el = $("sync");
  el.className = "sync " + (ok ? "on" : "off");
  el.textContent = ok ? "● Sincronizado" : "○ Offline";
}

/* =======================================================================
   FIREBASE
   ======================================================================= */
function listaDe(cru) {
  const out = [];
  if (!cru || typeof cru !== "object") return out;
  Object.keys(cru).forEach(function (k) {
    const v = cru[k];
    if (v && typeof v === "object") {
      const item = Object.assign({}, v);
      item._id = k;
      out.push(item);
    }
  });
  return out;
}

function normalizarProduto(p) {
  if (!p || typeof p !== "object") return null;
  const pn = up(p.partNumber || p.pn);
  if (!pn) return null;
  return {
    pn: pn,
    descricao: up(p.descricao),
    fornecedor: up(p.fornecedor),
    codigoFornecedor: up(p.codigoFornecedor),
    multiploCaixa: Number(p.multiploCaixa) || 0,
    multiploPallet: Number(p.multiploPallet) || 0
  };
}

function conectar() {
  try {
    if (!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
    db = firebase.database();

    db.ref(REF_PRODUTOS).on("value", function (snap) {
      produtos = listaDe(snap.val())
        .map(normalizarProduto)
        .filter(Boolean)
        .sort(function (a, b) { return a.pn.localeCompare(b.pn); });
      pintarSync(true);
    }, function () { pintarSync(false); });

    db.ref(REF_RESPONS).on("value", function (snap) {
      responsaveis = listaDe(snap.val())
        .map(function (r) { return { nome: r.nome || "" }; })
        .filter(function (r) { return r.nome; })
        .sort(function (a, b) { return up(a.nome).localeCompare(up(b.nome)); });
      pintarResponsaveis();
    }, function () {});

    db.ref(REF_LEITURAS).on("value", function (snap) {
      leituras = listaDe(snap.val()).sort(function (a, b) {
        return Number(a.criado || 0) - Number(b.criado || 0);
      });
      pintarLeituras();
      pintarSync(true);
    }, function () { pintarSync(false); });

  } catch (e) {
    pintarSync(false);
    msg("Firebase não inicializou: " + e.message, "erro");
  }
}

/* =======================================================================
   PARSERS DE ETIQUETA
   ======================================================================= */
function detectarTipo(bruto) {
  const cru = String(bruto == null ? "" : bruto).trim();
  if (!cru) return "desconhecido";
  if (/^[0-9]+\s*_/.test(cru)) return "cation";

  const t = soAlnum(cru);
  if (!t) return "desconhecido";

  if (t.indexOf("PRID") === 0) return "fornecedor";
  if (/^P0{6,}/.test(t) && t.length >= 20) return "mando";
  if (t.length >= 24 && /\d{6}$/.test(t)) return "mando";
  if (/^\d{4,12}$/.test(t)) return "fornecedor";

  return "desconhecido";
}

function parseMando(bruto) {
  const t = soAlnum(bruto);
  if (!t) return null;

  const corpo = t.charAt(0) === "P" ? t.slice(1) : t;

  let m = corpo.match(/([A-Z]{2,10})0*(\d{1,6})$/);
  if (!m) m = corpo.match(/([A-Z][A-Z0-9]{1,9})0*(\d{1,6})$/);
  if (!m) return null;

  const qtd = parseInt(m[2], 10);
  if (!qtd || qtd <= 0) return null;

  let resto = corpo.slice(0, m.index).replace(/^0+/, "");
  resto = resto.replace(/0{4,}$/, "").replace(/^0+/, "");
  if (!resto) return null;

  return { tipo: "mando", pn: resto, lote: m[1], quantidade: String(qtd), bruto: t };
}

function parseCation(bruto) {
  const t = String(bruto == null ? "" : bruto).trim().toUpperCase();
  const i = t.indexOf("_");
  if (i < 0) return null;

  const qtd = parseInt(t.slice(0, i).replace(/[^0-9]/g, ""), 10);
  if (!qtd || qtd <= 0) return null;

  let dir = t.slice(i + 1).replace(/_/g, "").replace(/[^A-Z0-9.\-\/]/g, "");
  dir = dir.replace(/^0+/, "").trim();
  if (!dir) return null;

  return { tipo: "cation", pn: dir, lote: null, quantidade: String(qtd), bruto: t };
}

const FORMATOS_FORNECEDOR = {
  DASOL: [/PRID[^A-Z0-9]*([A-Z0-9]{3,20})/],
  CATION: [/PRID[^A-Z0-9]*([A-Z0-9]{3,20})/]
};

const PADROES_GENERICOS = [
  /PRID[^A-Z0-9]*([A-Z0-9]{3,20})/,
  /LOTE[^A-Z0-9]*([A-Z0-9]{3,20})/,
  /LOT[^A-Z0-9]*([A-Z0-9]{3,20})/
];

function parseFornecedor(bruto) {
  const t = up(bruto);
  if (!t) return null;

  let forn, pads, i, m;

  for (forn in FORMATOS_FORNECEDOR) {
    pads = FORMATOS_FORNECEDOR[forn];
    for (i = 0; i < pads.length; i++) {
      m = t.match(pads[i]);
      if (m) return { tipo: "fornecedor", lote: m[1], fornecedor: forn, bruto: t };
    }
  }

  for (i = 0; i < PADROES_GENERICOS.length; i++) {
    m = t.match(PADROES_GENERICOS[i]);
    if (m) return { tipo: "fornecedor", lote: m[1], fornecedor: "?", bruto: t };
  }

  let limpo = t.replace(/\d{4}[-/.]\d{1,2}[-/.]\d{1,2}/g, " ");
  limpo = limpo.replace(/\d{1,2}[-/.]\d{1,2}[-/.]\d{2,4}/g, " ");

  const achados = limpo.match(/(?<!\d)\d{4,12}(?!\d)/g);
  if (achados && achados.length) {
    achados.sort(function (a, b) { return b.length - a.length; });
    return { tipo: "fornecedor", lote: achados[0], fornecedor: "?", bruto: t };
  }

  return null;
}

/* =======================================================================
   RESOLVER PN NO CATÁLOGO
   ======================================================================= */
function resolverPn(pnBruto) {
  const alvo = soAlnum(pnBruto);
  if (!alvo) return { produto: null, motivo: "vazio", candidatos: [] };

  const exatos = [], prefixos = [], parciais = [];

  produtos.forEach(function (p) {
    const n = soAlnum(p.pn);
    if (!n) return;
    if (n === alvo) exatos.push(p);
    else if (n.indexOf(alvo) === 0) prefixos.push(p);
    else if (n.indexOf(alvo) > -1 || alvo.indexOf(n) > -1) parciais.push(p);
  });

  const porTam = function (a, b) { return a.pn.length - b.pn.length; };

  if (exatos.length === 1) return { produto: exatos[0], motivo: "exato", candidatos: [] };
  if (prefixos.length === 1) return { produto: prefixos[0], motivo: "prefixo", candidatos: [] };
  if (prefixos.length > 1) {
    prefixos.sort(porTam);
    return { produto: prefixos[0], motivo: "multiplo", candidatos: prefixos.slice(0, 6) };
  }
  if (parciais.length === 1) return { produto: parciais[0], motivo: "contem", candidatos: [] };
  if (parciais.length > 1) {
    parciais.sort(porTam);
    return { produto: parciais[0], motivo: "multiplo", candidatos: parciais.slice(0, 6) };
  }

  return { produto: null, motivo: "nenhum", candidatos: [] };
}

/* =======================================================================
   PROCESSAMENTO DA ETIQUETA
   ======================================================================= */
function processarEtiqueta(texto) {
  const bruto = String(texto == null ? "" : texto).replace(/[\x00-\x1F\x7F]/g, "").trim();
  if (!bruto) return;

  const modo = $("modo").value;
  const tipo = (!modo || modo === "auto") ? detectarTipo(bruto) : modo;

  if (tipo === "cation") {
    const d = parseCation(bruto);
    if (!d) { msg("Código CATiON fora do padrão.\n" + bruto.slice(0, 70) +
                  "\nEsperado: 0000000280_000000BC410B4200.A2", "erro"); return; }
    aplicarCation(d);
    return;
  }

  if (tipo === "mando") {
    const d = parseMando(bruto);
    if (!d) { msg("Etiqueta Mando fora do padrão.\n" + bruto.slice(0, 70) +
                  "\nEsperado: P000…PN…LOTE…QTD", "erro"); return; }
    aplicarMando(d);
    return;
  }

  if (tipo === "fornecedor") {
    const d = parseFornecedor(bruto);
    if (!d) { msg("Etiqueta de fornecedor fora do padrão.\n" + bruto.slice(0, 70) +
                  "\nEsperado: prid889595", "erro"); return; }
    aplicarFornecedor(d);
    return;
  }

  msg("Código não reconhecido.\n" + bruto.slice(0, 70) +
      "\nEscolha o tipo no seletor e bipe de novo.", "erro");
}

function aplicarMando(d) {
  const r = resolverPn(d.pn);
  const p = r.produto;

  $("fPn").value = p ? p.pn : d.pn;
  $("fDesc").value = p ? p.descricao : "";
  $("fQtd").value = d.quantidade;
  $("fLoteM").value = d.lote || "";
  if (!$("fData").value) $("fData").value = hoje();

  let txt = "MANDO lido\nPN etiqueta: " + d.pn +
            "\nLote: " + (d.lote || "-") +
            "\nQuantidade: " + d.quantidade;

  if (p) {
    txt += "\nCatálogo: " + p.pn + " — " + (p.descricao || "-");
    if (r.motivo === "multiplo") {
      msg(txt + "\nAtenção: " + r.candidatos.length + " PNs parecidos. Confirme abaixo.", "aviso");
      pintarCandidatos(r.candidatos);
      return;
    }
    msg(txt, "ok");
  } else {
    msg(txt + "\nCatálogo: PN não encontrado — cadastre no módulo Cadastros.", "aviso");
  }

  $("fLoteF").focus();
}

function aplicarCation(d) {
  const r = resolverPn(d.pn);
  const p = r.produto;

  $("fPn").value = p ? p.pn : d.pn;
  $("fDesc").value = p ? p.descricao : "";
  $("fQtd").value = d.quantidade;
  if (!$("fData").value) $("fData").value = hoje();

  let txt = "CATiON lido\nPN etiqueta: " + d.pn +
            "\nQuantidade: " + d.quantidade +
            "\nEste código não traz lote — bipe a etiqueta do fornecedor.";

  if (p) {
    txt += "\nCatálogo: " + p.pn + " — " + (p.descricao || "-");
    if (r.motivo === "multiplo") {
      msg(txt + "\nAtenção: " + r.candidatos.length + " PNs parecidos. Confirme abaixo.", "aviso");
      pintarCandidatos(r.candidatos);
      return;
    }
    msg(txt, "ok");
  } else {
    msg(txt + "\nCatálogo: PN não encontrado — cadastre no módulo Cadastros.", "aviso");
  }

  $("fLoteF").focus();
}

function aplicarFornecedor(d) {
  $("fLoteF").value = d.lote || "";
  if (!$("fData").value) $("fData").value = hoje();

  let txt = "FORNECEDOR lido\nLote: " + (d.lote || "-") +
            "\nFornecedor: " + (d.fornecedor || "?");

  msg(txt, "ok");

  if (!$("fPn").value.trim()) $("bipe").focus();
  else $("fLoteF").focus();
}

/* =======================================================================
   BUSCA NO CATÁLOGO
   ======================================================================= */
function buscarProduto(termo, limite) {
  limite = limite || 12;
  const t = up(termo);
  if (!t) return { exato: null, candidatos: [] };

  for (let i = 0; i < produtos.length; i++) {
    if (produtos[i].pn === t) return { exato: produtos[i], candidatos: [] };
  }

  const low = t.toLowerCase();
  const achados = [];

  produtos.forEach(function (p) {
    const pn = p.pn.toLowerCase();
    const ds = (p.descricao || "").toLowerCase();
    if (pn.indexOf(low) > -1) achados.push({ pri: pn.indexOf(low) === 0 ? 0 : 1, p: p });
    else if (ds.indexOf(low) > -1) achados.push({ pri: 2, p: p });
  });

  achados.sort(function (a, b) {
    if (a.pri !== b.pri) return a.pri - b.pri;
    return a.p.pn.localeCompare(b.p.pn);
  });

  return {
    exato: null,
    candidatos: achados.slice(0, limite).map(function (x) { return x.p; })
  };
}

function pintarCandidatos(cands) {
  const box = $("cands");
  box.innerHTML = "";
  if (!cands || !cands.length) return;

  cands.forEach(function (p) {
    const div = document.createElement("div");
    div.className = "cand";

    const a = document.createElement("div");
    a.className = "pn";
    a.textContent = p.pn;

    const b = document.createElement("div");
    b.className = "ds";
    b.textContent = p.descricao || "(sem descrição)";

    div.appendChild(a);
    div.appendChild(b);

    div.addEventListener("click", function () {
      $("fPn").value = p.pn;
      $("fDesc").value = p.descricao || "";
      box.innerHTML = "";
      $("fBusca").value = "";
      $("fQtd").focus();
    });

    box.appendChild(div);
  });
}

/* =======================================================================
   RESPONSÁVEIS
   ======================================================================= */
function pintarResponsaveis() {
  const dl = $("listaResp");
  dl.innerHTML = "";
  responsaveis.forEach(function (r) {
    const o = document.createElement("option");
    o.value = r.nome;
    dl.appendChild(o);
  });
  const salvo = localStorage.getItem("inspecao_resp");
  if (salvo && !$("fResp").value) $("fResp").value = salvo;
}

/* =======================================================================
   TABELA
   ======================================================================= */
function pintarLeituras() {
  const tb = $("corpo");
  tb.innerHTML = "";
  $("tagCount").textContent = leituras.length;

  if (!leituras.length) {
    tb.innerHTML = '<tr><td colspan="8" class="vazio">Nenhuma leitura ainda.</td></tr>';
    return;
  }

  const frag = document.createDocumentFragment();

  leituras.forEach(function (le) {
    const tr = document.createElement("tr");
    const cels = [
      le.part_number || "",
      le.descricao || "",
      le.quantidade || "",
      le.lote_mando || "",
      le.lote_fornecedor || "",
      le.data_entrada || "",
      le.responsavel || ""
    ];

    cels.forEach(function (v, i) {
      const td = document.createElement("td");
      td.textContent = v;
      if (i === 0) td.className = "mono";
      if ((i === 3 || i === 4) && v === NA) td.style.color = "#b45309";
      tr.appendChild(td);
    });

    const tdX = document.createElement("td");
    const b = document.createElement("button");
    b.type = "button";
    b.className = "mini na";
    b.textContent = "×";
    b.style.padding = "4px 9px";
    b.addEventListener("click", function () { excluirLeitura(le); });
    tdX.appendChild(b);
    tr.appendChild(tdX);

    frag.appendChild(tr);
  });

  tb.appendChild(frag);
}

function excluirLeitura(le) {
  if (!le._id || !db) return;
  if (!confirm("Remover esta linha?")) return;
  db.ref(REF_LEITURAS + "/" + le._id).remove().catch(function (e) {
    msg("Falha ao excluir: " + e.message, "erro");
  });
}

function limparLista() {
  if (!leituras.length || !db) return;
  if (!confirm("Remover todas as " + leituras.length +
               " leituras?\n\nExporte o CSV antes, se precisar guardar.")) return;
  db.ref(REF_LEITURAS).remove().catch(function (e) {
    msg("Falha ao limpar: " + e.message, "erro");
  });
}

/* =======================================================================
   ADICIONAR
   ======================================================================= */
function adicionar(limparDepois) {
  if (!db) { msg("Banco não conectado.", "erro"); return; }

  const pn = $("fPn").value.trim();
  const ds = $("fDesc").value.trim();

  if (!pn && !ds) {
    msg("Informe ao menos o PART NUMBER ou a DESCRIÇÃO.", "erro");
    $("bipe").focus();
    return;
  }

  const resp = $("fResp").value.trim();
  if (!resp) {
    msg("Informe o responsável pela liberação.", "erro");
    $("fResp").focus();
    return;
  }

  if (!$("fData").value) $("fData").value = hoje();

  const reg = {
    part_number: pn,
    descricao: ds,
    quantidade: $("fQtd").value.trim() || NA,
    lote_mando: $("fLoteM").value.trim() || NA,
    lote_fornecedor: $("fLoteF").value.trim() || NA,
    data_entrada: $("fData").value,
    responsavel: resp,
    criado: Date.now(),
    origem: ORIGEM
  };

  db.ref(REF_LEITURAS).push(reg).then(function () {
    localStorage.setItem("inspecao_resp", resp);
    msg("Linha adicionada.", "ok");
    if (limparDepois) limparCampos();
  }).catch(function (e) {
    msg("Não foi possível salvar.\n" + e.message, "erro");
  });
}

function limparCampos() {
  ["fPn", "fDesc", "fQtd", "fLoteM", "fLoteF"].forEach(function (id) {
    $(id).value = "";
  });
  $("fData").value = hoje();
  $("fBusca").value = "";
  $("cands").innerHTML = "";
  msgOff();
  $("bipe").focus();
}

/* =======================================================================
   CSV
   ======================================================================= */
function exportarCsv() {
  if (!leituras.length) { msg("Nenhuma linha para exportar.", "aviso"); return; }

  const cab = ["PART NUMBER", "DESCRIÇÃO", "QUANTIDADE", "LOTE MANDO",
               "LOTE FORNECEDOR", "DATA DE ENTRADA", "RESPONSÁVEL"];
  const linhas = [cab.join(";")];

  leituras.forEach(function (le) {
    const l = [le.part_number, le.descricao, le.quantidade, le.lote_mando,
               le.lote_fornecedor, le.data_entrada, le.responsavel];
    linhas.push(l.map(function (v) {
      return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
    }).join(";"));
  });

  const blob = new Blob(["\ufeff" + linhas.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "Inspecao_" + hoje() + ".csv";
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
}

/* =======================================================================
   CÂMERA — padrão do pesagem.html (funciona em iPhone e Android)
   ======================================================================= */
let html5Qr = null;
let cameraRodando = false;

function pararCamera() {
  const box = $("qr-reader");
  const btn = $("btnCamera");

  if (html5Qr) {
    const inst = html5Qr;
    html5Qr = null;
    try {
      if (cameraRodando) {
        inst.stop().then(function () {
          try { inst.clear(); } catch (e) {}
        }).catch(function () {});
      } else {
        try { inst.clear(); } catch (e) {}
      }
    } catch (e) {}
  }

  cameraRodando = false;
  if (box) box.className = "";
  if (btn) btn.textContent = "Câmera";
}

function abrirCamera() {
  const box = $("qr-reader");
  const btn = $("btnCamera");

  // já aberta -> fecha
  if (cameraRodando) {
    pararCamera();
    return;
  }

  if (typeof Html5Qrcode === "undefined") {
    msg("Biblioteca de leitura não carregou.\nVerifique a internet e recarregue a página.", "erro");
    return;
  }

  // limpa resíduo de uma sessão anterior
  box.innerHTML = "";
  box.className = "on";
  btn.textContent = "Parar";
  msg("Abrindo a câmera...", "aviso");

  const formatos = [];
  try {
    const F = Html5QrcodeSupportedFormats;
    formatos.push(F.QR_CODE);
    formatos.push(F.DATA_MATRIX);
    formatos.push(F.CODE_128);
    formatos.push(F.CODE_39);
    formatos.push(F.CODE_93);
    formatos.push(F.ITF);
  } catch (e) {}

  const config = {
    fps: 10,
    qrbox: { width: 240, height: 240 },
    showTorchButtonIfSupported: true
  };
  if (formatos.length) config.formatsToSupport = formatos;

  html5Qr = new Html5Qrcode("qr-reader");

  // start() chamado direto no clique, sem await antes (preserva o gesto no iOS)
  html5Qr.start(
    { facingMode: "environment" },
    config,
    function (texto) {
      pararCamera();
      msg("Código lido!", "ok");
      processarEtiqueta(texto);
    },
    function () { /* "não encontrado" entre frames é normal */ }
  ).then(function () {
    cameraRodando = true;
    msg("Aponte para o QR Code ou código de barras da etiqueta.", "ok");
  }).catch(function (e) {
    cameraRodando = false;
    box.className = "";
    btn.textContent = "Câmera";
    msg("Não foi possível abrir a câmera.\n" + (e && e.message ? e.message : e) +
        "\n\nVerifique a permissão de câmera do navegador. " +
        "A página precisa estar em HTTPS.", "erro");
    try { if (html5Qr) html5Qr.clear(); } catch (_) {}
    html5Qr = null;
  });
}

/* =======================================================================
   EVENTOS
   ======================================================================= */
function ligarEventos() {

  $("bipe").addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    e.preventDefault();
    const t = $("bipe").value.trim();
    $("bipe").value = "";
    if (t) processarEtiqueta(t);
  });

  $("btnColar").addEventListener("click", function () {
    const t = prompt("Cole o código da etiqueta:");
    if (t && t.trim()) processarEtiqueta(t.trim());
  });

  $("btnDigitar").addEventListener("click", function () {
    const t = prompt("Digite o código da etiqueta:");
    if (t && t.trim()) processarEtiqueta(t.trim());
  });

  $("btnCamera").addEventListener("click", abrirCamera);

  $("fBusca").addEventListener("input", function () {
    const t = $("fBusca").value.trim();
    if (t.length < 2) { $("cands").innerHTML = ""; return; }

    const r = buscarProduto(t);
    if (r.exato) {
      $("cands").innerHTML = "";
      $("fPn").value = r.exato.pn;
      $("fDesc").value = r.exato.descricao || "";
      return;
    }
    pintarCandidatos(r.candidatos);
  });

  $("fBusca").addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    e.preventDefault();
    const r = buscarProduto($("fBusca").value.trim());
    const alvo = r.exato || (r.candidatos.length === 1 ? r.candidatos[0] : null);
    if (!alvo) return;
    $("fPn").value = alvo.pn;
    $("fDesc").value = alvo.descricao || "";
    $("fBusca").value = "";
    $("cands").innerHTML = "";
    $("fQtd").focus();
  });

  document.querySelectorAll("[data-na]").forEach(function (b) {
    b.addEventListener("click", function () {
      $(b.getAttribute("data-na")).value = NA;
    });
  });

  document.querySelectorAll("[data-hoje]").forEach(function (b) {
    b.addEventListener("click", function () {
      $(b.getAttribute("data-hoje")).value = hoje();
    });
  });

  $("btnResp").addEventListener("click", function () {
    const nome = prompt("Nome do responsável:");
    if (!nome || !nome.trim()) return;
    const n = nome.trim();
    const chave = n.toUpperCase().replace(/\s+/g, "_");
    if (!db) { msg("Banco não conectado.", "erro"); return; }
    db.ref(REF_RESPONS + "/" + chave).set({ nome: n }).then(function () {
      $("fResp").value = n;
      msg("Responsável cadastrado: " + n, "ok");
    }).catch(function (e) {
      msg("Falha ao cadastrar responsável: " + e.message, "erro");
    });
  });

  $("fResp").addEventListener("change", function () {
    const v = $("fResp").value.trim();
    if (v) localStorage.setItem("inspecao_resp", v);
  });

  $("btnAdd").addEventListener("click", function () { adicionar(false); });
  $("btnAddLimpar").addEventListener("click", function () { adicionar(true); });
  $("btnCsv").addEventListener("click", exportarCsv);
  $("btnLimpar").addEventListener("click", limparLista);

  document.addEventListener("visibilitychange", function () {
    if (document.hidden && cameraRodando) pararCamera();
  });
}

/* =======================================================================
   INÍCIO
   ======================================================================= */
document.addEventListener("DOMContentLoaded", function () {
  ligarEventos();
  $("fData").value = hoje();
  conectar();
  $("bipe").focus();
});
</script>
